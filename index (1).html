// Hora atual no fuso da Bahia (America/Bahia, UTC-3, sem horário de verão)
function nowInBahia() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Bahia",
    weekday: "short",
    hour: "numeric",
    minute: "numeric",
    hour12: false,
  }).formatToParts(new Date());
  const get = (t) => parts.find((p) => p.type === t)?.value;
  const dayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return {
    day: dayMap[get("weekday")],
    hour: (parseInt(get("hour"), 10) % 24) + parseInt(get("minute"), 10) / 60,
  };
}

function isOpenNow(hours, now) {
  if (!now) return null; // ainda não calculado (evita erro de hidratação)
  const range = hours[now.day];
  if (!range) return false;
  return now.hour >= range[0] && now.hour < range[1];
}

function whatsappLink(business) {
  const msg = `Olá! Vi o *${business.name}* no Guia Regional e gostaria de mais informações.`;
  return `https://wa.me/${business.phone}?text=${encodeURIComponent(msg)}`;
}

/* --------------------------------- PÁGINA --------------------------------- */

function GuiaRegionalPage() {
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("");
  const [city, setCity] = useState("");
  const [now, setNow] = useState(null);

  // Atualiza o "Aberto Agora" a cada minuto (apenas no cliente)
  useEffect(() => {
    setNow(nowInBahia());
    const t = setInterval(() => setNow(nowInBahia()), 60_000);
    return () => clearInterval(t);
  }, []);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return BUSINESSES.filter(
      (b) =>
        (!city || b.city === city) &&
        (!category || b.category === category) &&
        (!q || b.name.toLowerCase().includes(q))
    );
  }, [query, category, city]);

  const scrollToResults = () =>
    document.getElementById("destaques")?.scrollIntoView({ behavior: "smooth" });

  const clearFilters = () => {
    setQuery("");
    setCategory("");
    setCity("");
  };

  return (
    <div className="min-h-screen bg-white font-sans text-slate-800 antialiased">
      <Header city={city} setCity={setCity} />
      <main>
        <Hero
          query={query}
          setQuery={setQuery}
          category={category}
          setCategory={setCategory}
          city={city}
          setCity={setCity}
          onSearch={scrollToResults}
        />
        <Categories active={category} setActive={setCategory} />
        <div id="destaques">
          <Featured items={filtered} now={now} onClear={clearFilters} />
        </div>
        <Agenda />
        <CtaBusiness />
      </main>
      <Footer />
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(<GuiaRegionalPage />);
  </script>
