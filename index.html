<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guia do Sertão - Comércio e Serviços Regionais</title>
  <meta name="description" content="Guia comercial e de serviços de Macaúbas, Vitória da Conquista, Paramirim, Boquira e região." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    /* ========================================================================
     *  CONFIGURAÇÃO DO SUPABASE  ->  preencha os dois valores abaixo
     *  Supabase > Project Settings > API
     *   - Project URL:  https://xxxxxxxx.supabase.co
     *   - anon public key (a chave "anon", NUNCA a "service_role")
     * ====================================================================== */
    const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
    const SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-AQUI";

    const SUPABASE_OK =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("SEU-PROJETO") &&
      !SUPABASE_ANON_KEY.includes("SUA-CHAVE");
    const sb = SUPABASE_OK
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    /* --------------------------- Ícones (Lucide, embutidos) --------------------------- */
    const ICON_PATHS = {
      Search: <><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>,
      MapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>,
      Sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></>,
      Menu: <path d="M4 6h16M4 12h16M4 18h16" />,
      X: <path d="M18 6 6 18M6 6l12 12" />,
      ChevronDown: <path d="m6 9 6 6 6-6" />,
      Store: <><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" /><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" /><path d="M2 7h20" /><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-2-.8 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-2 .8 2 2 0 0 1-2-2V7" /></>,
      Utensils: <><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></>,
      HeartPulse: <><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" /></>,
      Wrench: <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />,
      BedDouble: <><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8" /><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4" /><path d="M12 4v6" /><path d="M2 18h20" /></>,
      Briefcase: <><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></>,
      CalendarDays: <><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" /></>,
      Music: <><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></>,
      Tent: <><path d="M3.5 21 14 3" /><path d="M20.5 21 10 3" /><path d="M15.5 21 12 15l-3.5 6" /><path d="M2 21h20" /></>,
      ShoppingBasket: <><path d="m15 11-1 9" /><path d="m19 11-4-7" /><path d="M2 11h20" /><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" /><path d="M4.5 15.5h15" /><path d="m5 11 4-7" /><path d="m9 11 1 9" /></>,
      Instagram: <><rect width="20" height="20" x="2" y="2" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><path d="M17.5 6.5h.01" /></>,
      Loader: <path d="M21 12a9 9 0 1 1-6.219-8.56" />,
      CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m9 11 3 3L22 4" /></>,
      AlertCircle: <><circle cx="12" cy="12" r="10" /><path d="M12 8v4M12 16h.01" /></>,
      LogIn: <><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><path d="m10 17 5-5-5-5" /><path d="M15 12H3" /></>,
      LogOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /></>,
      User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
      Mail: <><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></>,
      Lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
      Image: <><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></>,
    };
    const makeIcon = (name) => ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round" className={className} aria-hidden="true">
        {ICON_PATHS[name]}
      </svg>
    );
    const Search = makeIcon("Search"), MapPin = makeIcon("MapPin"), Sun = makeIcon("Sun"),
      Menu = makeIcon("Menu"), X = makeIcon("X"), ChevronDown = makeIcon("ChevronDown"),
      Store = makeIcon("Store"), Utensils = makeIcon("Utensils"), HeartPulse = makeIcon("HeartPulse"),
      Wrench = makeIcon("Wrench"), BedDouble = makeIcon("BedDouble"), Briefcase = makeIcon("Briefcase"),
      CalendarDays = makeIcon("CalendarDays"), Music = makeIcon("Music"), Tent = makeIcon("Tent"),
      ShoppingBasket = makeIcon("ShoppingBasket"), Instagram = makeIcon("Instagram"),
      Loader = makeIcon("Loader"), CheckCircle = makeIcon("CheckCircle"),
      AlertCircle = makeIcon("AlertCircle"), ImageIcon = makeIcon("Image"),
      LogIn = makeIcon("LogIn"), LogOut = makeIcon("LogOut"), UserIcon = makeIcon("User"),
      Mail = makeIcon("Mail"), Lock = makeIcon("Lock");

    /* ------------------------------------ DADOS ------------------------------------ */
    const CITIES = ["Macaúbas", "Vitória da Conquista", "Paramirim", "Boquira"];
    const OTHER_CITY = "__outra__";

    // O "id" é exatamente o texto salvo na coluna `categoria` do Supabase
    const CATEGORIES = [
      { id: "Alimentação", icon: Utensils },
      { id: "Saúde", icon: HeartPulse },
      { id: "Serviços", icon: Wrench },
      { id: "Hospedagem", icon: BedDouble },
      { id: "Vagas", icon: Briefcase },
      { id: "Eventos", icon: CalendarDays },
    ];

    // Agenda de exemplo (edite à vontade)
    const EVENTS = [
      { id: 1, title: "Festa de Largo do Povoado", city: "Macaúbas", day: "14", month: "NOV", type: "Festa de largo", icon: Tent },
      { id: 2, title: "Show de Forró com Banda Regional", city: "Vitória da Conquista", day: "21", month: "NOV", type: "Show", icon: Music },
      { id: 3, title: "Feira da Agricultura Familiar", city: "Paramirim", day: "28", month: "NOV", type: "Feira", icon: ShoppingBasket },
      { id: 4, title: "Arraiá de Natal Boquirense", city: "Boquira", day: "12", month: "DEZ", type: "Festa", icon: Music },
    ];

    /* ----------------------------------- HELPERS ----------------------------------- */
    const onlyDigits = (v) => String(v || "").replace(/\D/g, "");

    // Aceita (77) 99999-0000, 77999990000 ou 5577999990000 -> devolve 5577999990000
    function normalizeWhats(v) {
      const d = onlyDigits(v);
      if (d.length === 10 || d.length === 11) return "55" + d;
      if ((d.length === 12 || d.length === 13) && d.startsWith("55")) return d;
      return "";
    }

    // Aceita @usuario, usuario ou link do perfil -> devolve só o usuário
    function cleanInstagram(v) {
      const u = String(v || "").trim()
        .replace(/^https?:\/\/(www\.)?instagram\.com\//i, "")
        .replace(/^@/, "")
        .split(/[/?#]/)[0];
      return /^[A-Za-z0-9._]{1,30}$/.test(u) ? u : "";
    }

    function safeUrl(v) {
      try {
        const u = new URL(String(v || "").trim());
        return u.protocol === "http:" || u.protocol === "https:" ? u.href : "";
      } catch { return ""; }
    }

    // Só aceita links do Google Maps (evita link malicioso salvo por outra pessoa)
    function safeMapUrl(v) {
      const u = safeUrl(v);
      if (!u) return "";
      try {
        const { hostname: h, pathname: p } = new URL(u);
        const ok =
          h === "maps.app.goo.gl" || h === "maps.google.com" ||
          (h === "goo.gl" && p.startsWith("/maps")) ||
          (/^(www\.)?google\.[a-z.]+$/.test(h) && p.startsWith("/maps"));
        return ok ? u : "";
      } catch { return ""; }
    }

    // Link "Como chegar": usa o mapa_url; se não houver, busca pelo endereço
    function mapsLink(b) {
      const direct = safeMapUrl(b.mapa_url);
      if (direct) return direct;
      const q = [b.nome_fantasia, b.endereco, b.cidade, "BA"].filter(Boolean).join(", ");
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }

    // Traduz erros de autenticação do Supabase
    function authMsg(err) {
      const m = String((err && err.message) || "").toLowerCase();
      if (m.includes("invalid login")) return "E-mail ou senha incorretos.";
      if (m.includes("not confirmed")) return "Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada.";
      if (m.includes("already registered")) return "Este e-mail já está cadastrado. Tente entrar.";
      if (m.includes("rate limit") || m.includes("too many")) return "Muitas tentativas. Aguarde alguns minutos e tente novamente.";
      if (m.includes("password") && (m.includes("characters") || m.includes("weak"))) return "Senha fraca. Use pelo menos 8 caracteres.";
      if (m.includes("provider") && (m.includes("not enabled") || m.includes("unsupported"))) return "O login com Google ainda não está ativado neste projeto.";
      return "Não foi possível concluir. Tente novamente.";
    }

    const PENDING_KEY = "guia_abrir_cadastro";

    function whatsappLink(b) {
      const msg = `Olá! Vi o *${b.nome_fantasia}* no Guia do Sertão e gostaria de mais informações.`;
      return `https://wa.me/${onlyDigits(b.whatsapp)}?text=${encodeURIComponent(msg)}`;
    }

    /* ---------------------------------- COMPONENTES ---------------------------------- */
    function WhatsAppIcon({ className = "h-5 w-5" }) {
      return (
        <svg viewBox="0 0 24 24" fill="currentColor" className={className} aria-hidden="true">
          <path d="M12.04 2a9.9 9.9 0 0 0-8.43 15.1L2 22l5.04-1.58A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-2.99.94.97-2.91-.2-.31a8.2 8.2 0 1 1 6.7 3.6Zm4.5-6.14c-.25-.12-1.46-.72-1.68-.8-.23-.08-.4-.12-.56.12-.17.25-.64.8-.78.97-.14.16-.29.18-.54.06a6.7 6.7 0 0 1-3.3-2.88c-.25-.43.25-.4.72-1.33.08-.16.04-.3-.02-.42-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.16 0-.43.06-.65.3-.23.25-.87.85-.87 2.07s.9 2.4 1.01 2.57c.12.16 1.75 2.67 4.24 3.75 1.58.68 2.2.74 3 .62.49-.07 1.46-.6 1.67-1.17.2-.58.2-1.07.14-1.17-.06-.1-.23-.16-.48-.28Z" />
        </svg>
      );
    }

    function CitySelect({ city, setCity, full = false }) {
      return (
        <div className={`relative ${full ? "w-full" : ""}`}>
          <MapPin className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-amber-300" />
          <select
            value={city}
            onChange={(e) => setCity(e.target.value)}
            aria-label="Filtrar por cidade"
            className="w-full appearance-none rounded-full border border-white/15 bg-green-900 py-2.5 pl-9 pr-9 text-sm font-medium text-white outline-none transition hover:bg-green-800 focus:ring-2 focus:ring-amber-400"
          >
            <option value="">Toda a região</option>
            {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <ChevronDown className="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-white/70" />
        </div>
      );
    }

    function GoogleIcon({ className = "h-5 w-5" }) {
      return (
        <svg viewBox="0 0 48 48" className={className} aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
      );
    }

    function userInfo(user) {
      const md = (user && user.user_metadata) || {};
      const email = (user && user.email) || "";
      return {
        name: md.full_name || md.name || (email ? email.split("@")[0] : "Usuário"),
        avatar: safeUrl(md.avatar_url || md.picture),
        email,
      };
    }

    function Avatar({ info, size = "h-9 w-9" }) {
      const [failed, setFailed] = useState(false);
      if (info.avatar && !failed) {
        return (
          <img src={info.avatar} alt="" referrerPolicy="no-referrer" onError={() => setFailed(true)}
            className={`${size} rounded-full object-cover ring-2 ring-amber-400`} />
        );
      }
      return (
        <span className={`${size} grid place-items-center rounded-full bg-amber-400 text-sm font-extrabold text-green-950`}>
          {(info.name || "?").charAt(0).toUpperCase()}
        </span>
      );
    }

    function Header({ city, setCity, user, onRegister, onLogin, onLogout }) {
      const [open, setOpen] = useState(false);
      const [menu, setMenu] = useState(false);
      const info = user ? userInfo(user) : null;

      return (
        <header className="sticky top-0 z-40 border-b border-white/10 bg-green-950/95 backdrop-blur">
          <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
            <a href="#" className="flex items-center gap-2">
              <span className="grid h-10 w-10 place-items-center rounded-xl bg-amber-400 text-green-950 shadow-lg shadow-amber-400/20">
                <Sun className="h-6 w-6" />
              </span>
              <span className="leading-tight">
                <span className="block text-lg font-extrabold tracking-tight text-white">Guia do Sertão</span>
                <span className="block text-[10px] font-medium uppercase tracking-widest text-amber-300">Comércio &amp; Serviços</span>
              </span>
            </a>

            {/* Desktop */}
            <div className="hidden items-center gap-3 md:flex">
              <CitySelect city={city} setCity={setCity} />
              <button
                onClick={onRegister}
                className="inline-flex items-center gap-2 rounded-full bg-amber-400 px-5 py-2.5 text-sm font-bold text-green-950 transition hover:bg-amber-300"
              >
                <Store className="h-4 w-4" /> Cadastrar meu Negócio
              </button>

              {info ? (
                <div className="relative">
                  <button
                    onClick={() => setMenu(!menu)} aria-label="Menu da conta"
                    className="flex items-center gap-2 rounded-full bg-white/10 py-1 pl-1 pr-3 text-white transition hover:bg-white/20"
                  >
                    <Avatar info={info} />
                    <span className="max-w-[110px] truncate text-sm font-semibold">{info.name.split(" ")[0]}</span>
                    <ChevronDown className="h-4 w-4 text-white/70" />
                  </button>
                  {menu && (
                    <>
                      <button className="fixed inset-0 z-40 cursor-default" aria-label="Fechar menu" onClick={() => setMenu(false)} />
                      <div className="absolute right-0 z-50 mt-2 w-64 overflow-hidden rounded-2xl border border-stone-200 bg-white text-stone-800 shadow-xl">
                        <div className="border-b border-stone-100 p-4">
                          <p className="truncate font-bold text-green-950">{info.name}</p>
                          <p className="truncate text-xs text-stone-500">{info.email}</p>
                        </div>
                        <button
                          onClick={() => { setMenu(false); onRegister(); }}
                          className="flex w-full items-center gap-2 px-4 py-3 text-sm font-semibold text-green-900 hover:bg-green-50"
                        >
                          <Store className="h-4 w-4" /> Cadastrar empresa
                        </button>
                        <button
                          onClick={() => { setMenu(false); onLogout(); }}
                          className="flex w-full items-center gap-2 px-4 py-3 text-sm font-semibold text-rose-700 hover:bg-rose-50"
                        >
                          <LogOut className="h-4 w-4" /> Sair
                        </button>
                      </div>
                    </>
                  )}
                </div>
              ) : (
                <button
                  onClick={onLogin}
                  className="inline-flex items-center gap-2 rounded-full border border-white/30 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-white/10"
                >
                  <LogIn className="h-4 w-4" /> Entrar / Criar Conta
                </button>
              )}
            </div>

            {/* Mobile */}
            <button onClick={() => setOpen(!open)} className="rounded-lg p-2 text-white hover:bg-white/10 md:hidden" aria-label="Abrir menu">
              {open ? <X /> : <Menu />}
            </button>
          </div>

          {open && (
            <div className="space-y-3 border-t border-white/10 px-4 pb-4 pt-3 md:hidden">
              {info && (
                <div className="flex items-center gap-3 rounded-2xl bg-white/10 p-3 text-white">
                  <Avatar info={info} size="h-11 w-11" />
                  <div className="min-w-0">
                    <p className="truncate font-bold">{info.name}</p>
                    <p className="truncate text-xs text-green-200">{info.email}</p>
                  </div>
                </div>
              )}
              <CitySelect city={city} setCity={setCity} full />
              <button
                onClick={() => { setOpen(false); onRegister(); }}
                className="flex w-full items-center justify-center gap-2 rounded-full bg-amber-400 px-5 py-3 text-sm font-bold text-green-950"
              >
                <Store className="h-4 w-4" /> Cadastrar meu Negócio
              </button>
              {info ? (
                <button
                  onClick={() => { setOpen(false); onLogout(); }}
                  className="flex w-full items-center justify-center gap-2 rounded-full border border-white/30 px-5 py-3 text-sm font-semibold text-white"
                >
                  <LogOut className="h-4 w-4" /> Sair
                </button>
              ) : (
                <button
                  onClick={() => { setOpen(false); onLogin(); }}
                  className="flex w-full items-center justify-center gap-2 rounded-full border border-white/30 px-5 py-3 text-sm font-semibold text-white"
                >
                  <LogIn className="h-4 w-4" /> Entrar / Criar Conta
                </button>
              )}
            </div>
          )}
        </header>
      );
    }

    function Hero({ query, setQuery, category, setCategory, city, setCity, onSearch }) {
      const field = "w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-800 outline-none focus:ring-2 focus:ring-amber-400";
      return (
        <section className="relative overflow-hidden bg-gradient-to-br from-green-950 via-green-900 to-green-700 text-white">
          <div className="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-amber-400/30 blur-3xl" />
          <div className="pointer-events-none absolute -bottom-32 -left-20 h-72 w-72 rounded-full bg-yellow-300/10 blur-3xl" />

          <div className="relative mx-auto max-w-6xl px-4 py-14 sm:py-20">
            <span className="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs font-semibold text-amber-300 ring-1 ring-white/15">
              <Sun className="h-3.5 w-3.5" /> Sudoeste baiano ao seu alcance
            </span>
            <h1 className="mt-5 max-w-3xl text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl lg:text-6xl">

    /* ------------------------------ MODAL BASE ------------------------------ */
    function Modal({ title, icon: Icon, onClose, children }) {
      useEffect(() => {
        const onKey = (e) => e.key === "Escape" && onClose();
        document.addEventListener("keydown", onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => {
          document.removeEventListener("keydown", onKey);
          document.body.style.overflow = prev;
        };
      }, []);
      return (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center bg-green-950/70 p-0 backdrop-blur-sm sm:items-center sm:p-4"
          onMouseDown={(e) => e.target === e.currentTarget && onClose()} role="dialog" aria-modal="true"

    /* ------------------------------ LOGIN / CRIAR CONTA ------------------------------ */
    function AuthModal({ onClose, reason }) {
      const [mode, setMode] = useState("login"); // login | signup | reset
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null); // { type: "ok" | "err", text }

      const redirectTo = window.location.origin + window.location.pathname;

      async function handleGoogle() {
        setMsg(null);
        if (!sb) return setMsg({ type: "err", text: "Conecte o Supabase no código (SUPABASE_URL e SUPABASE_ANON_KEY)." });
        if (reason === "register") {
          try { sessionStorage.setItem(PENDING_KEY, "1"); } catch {}
        }
        const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo } });
        if (error) {
          try { sessionStorage.removeItem(PENDING_KEY); } catch {}
          setMsg({ type: "err", text: authMsg(error) });
        }
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setMsg(null);
        if (!sb) return setMsg({ type: "err", text: "Conecte o Supabase no código (SUPABASE_URL e SUPABASE_ANON_KEY)." });
        const mail = email.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(mail)) return setMsg({ type: "err", text: "Informe um e-mail válido." });

        setBusy(true);
        try {
          if (mode === "reset") {
            const { error } = await sb.auth.resetPasswordForEmail(mail, { redirectTo });
            if (error) return setMsg({ type: "err", text: authMsg(error) });
            return setMsg({ type: "ok", text: "Se este e-mail tiver conta, enviamos um link para criar uma nova senha." });
          }
          if (mode === "login") {
            const { error } = await sb.auth.signInWithPassword({ email: mail, password });
            if (error) return setMsg({ type: "err", text: authMsg(error) });
            return; // o onAuthStateChange fecha o modal
          }
          // signup
          if (password.length < 8) return setMsg({ type: "err", text: "A senha deve ter pelo menos 8 caracteres." });
          const { data, error } = await sb.auth.signUp({ email: mail, password, options: { emailRedirectTo: redirectTo } });
          if (error) return setMsg({ type: "err", text: authMsg(error) });
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            return setMsg({ type: "err", text: "Este e-mail já está cadastrado. Entre ou use \"Esqueci a senha\"." });
          }
          if (data.session) return; // confirmação de e-mail desligada: já entrou
          setMsg({ type: "ok", text: `Enviamos um e-mail de confirmação para ${mail}. Clique no link para ativar sua conta e depois volte para entrar.` });
        } finally {
          setBusy(false);
        }
      }

      const title = mode === "signup" ? "Criar conta" : mode === "reset" ? "Recuperar senha" : "Entrar";
      const tab = (id, text) => (
        <button
          type="button" onClick={() => { setMode(id); setMsg(null); }}
          className={`flex-1 rounded-full py-2 text-sm font-bold transition ${
            mode === id ? "bg-green-900 text-white shadow" : "text-green-900 hover:bg-green-50"
          }`}
        >{text}</button>
      );

      return (
        <Modal title={title} icon={UserIcon} onClose={onClose}>
          <div className="space-y-4 p-5">
            {reason === "register" && (
              <p className="rounded-xl bg-amber-50 p-3 text-sm text-amber-900">
                Para cadastrar sua empresa, entre ou crie uma conta. É rápido e gratuito.
              </p>
            )}

            {mode !== "reset" && (
              <>
                <div className="flex gap-1 rounded-full bg-stone-100 p-1">
                  {tab("login", "Entrar")}
                  {tab("signup", "Criar conta")}
                </div>

                <button
                  type="button" onClick={handleGoogle}
                  className="flex w-full items-center justify-center gap-3 rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm font-bold text-stone-800 shadow-sm transition hover:bg-stone-50"
                >
                  <GoogleIcon /> Continuar com Google
                </button>

                <div className="flex items-center gap-3 text-xs text-stone-400">
                  <span className="h-px flex-1 bg-stone-200" /> ou com e-mail <span className="h-px flex-1 bg-stone-200" />
                </div>
              </>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className={labelCls}>E-mail</label>
                <div className="relative">
                  <Mail className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                  <input
                    type="email" autoComplete="email" required className={`${inputCls} pl-9`}
                    value={email} onChange={(e) => setEmail(e.target.value)} placeholder="voce@email.com"
                  />
                </div>
              </div>

              {mode !== "reset" && (
                <div>
                  <label className={labelCls}>Senha</label>
                  <div className="relative">
                    <Lock className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                    <input
                      type="password" required className={`${inputCls} pl-9`}
                      autoComplete={mode === "signup" ? "new-password" : "current-password"}
                      value={password} onChange={(e) => setPassword(e.target.value)}
                      placeholder={mode === "signup" ? "Mínimo de 8 caracteres" : "Sua senha"}
                    />
                  </div>
                </div>
              )}

              {msg && <Notice type={msg.type}>{msg.text}</Notice>}

              <button
                type="submit" disabled={busy}
                className="inline-flex w-full items-center justify-center gap-2 rounded-full bg-amber-400 px-6 py-3 text-sm font-bold text-green-950 transition hover:bg-amber-300 disabled:opacity-60"
              >
                {busy && <Loader className="h-4 w-4 animate-spin" />}
                {mode === "login" ? "Entrar" : mode === "signup" ? "Criar minha conta" : "Enviar link de recuperação"}
              </button>
            </form>

            <div className="text-center text-sm">
              {mode === "login" && (
                <button type="button" onClick={() => { setMode("reset"); setMsg(null); }} className="font-semibold text-green-800 hover:underline">
                  Esqueci a senha
                </button>
              )}
              {mode === "reset" && (
                <button type="button" onClick={() => { setMode("login"); setMsg(null); }} className="font-semibold text-green-800 hover:underline">
                  Voltar para o login
                </button>
              )}
            </div>
          </div>
        </Modal>
      );
    }

    // Aparece quando a pessoa chega pelo link "recuperar senha" do e-mail
    function NewPasswordModal({ onClose }) {
      const [pw, setPw] = useState("");
      const [msg, setMsg] = useState(null);

            </form>

    /* ------------------------------ CADASTRAR EMPRESA ------------------------------ */
    const EMPTY_FORM = {
      nome_fantasia: "", categoria: "", cidade: "", outraCidade: "",
      endereco: "", whatsapp: "", instagram: "", descricao: "", imagem_url: "", mapa_url: "",
      website: "", // campo-isca anti-spam (deve ficar vazio)
    };

    function RegisterModal({ user, onClose }) {
      const [form, setForm] = useState(EMPTY_FORM);
      const [sending, setSending] = useState(false);
      const [error, setError] = useState("");
      const [done, setDone] = useState(null); // { emailSent: boolean }

      const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

      async function handleSubmit(e) {
        e.preventDefault();
        setError("");
        if (form.website) { setDone({ ok: true }); return; } // robô: finge sucesso e não envia
        if (!sb || !user) return setError("Você precisa estar logado para cadastrar uma empresa.");

        const nome = form.nome_fantasia.trim();
        const cidade = form.cidade === OTHER_CITY ? form.outraCidade.trim() : form.cidade;
        const whatsapp = normalizeWhats(form.whatsapp);
        const instagram = cleanInstagram(form.instagram);
        const imagem = safeUrl(form.imagem_url);
        const mapa = safeMapUrl(form.mapa_url);

        if (nome.length < 2) return setError("Informe o nome fantasia do negócio.");
        if (!form.categoria) return setError("Escolha uma categoria.");
        if (!cidade) return setError("Informe a cidade.");
        if (!whatsapp) return setError("WhatsApp inválido. Use DDD + número, ex.: (77) 99999-0000.");
        if (form.instagram.trim() && !instagram) return setError("Instagram inválido. Use @usuario ou o link do perfil.");
        if (form.imagem_url.trim() && !imagem) return setError("A URL da foto/logo deve começar com http:// ou https://");
        if (form.mapa_url.trim() && !mapa) return setError("O link do mapa deve ser do Google Maps (google.com/maps ou maps.app.goo.gl).");

        setSending(true);
        const { error: dbError } = await sb.from("estabelecimentos").insert({
          nome_fantasia: nome.slice(0, 120),
          categoria: form.categoria,
          cidade: cidade.slice(0, 80),
          endereco: form.endereco.trim().slice(0, 200) || null,
          whatsapp,
          instagram: instagram || null,
          descricao: form.descricao.trim().slice(0, 500) || null,
          imagem_url: imagem || null,
          mapa_url: mapa || null,
          aprovado: false, // sempre entra pendente de aprovação
          user_id: user.id,
        });

        if (dbError) {
          setSending(false);
          console.error(dbError);
          return setError("Não foi possível enviar agora. Tente novamente em instantes.");
        }

        setSending(false);
        setDone({ ok: true });
      }

      return (
        <Modal title="Cadastrar meu Negócio" icon={Store} onClose={onClose}>
          {done ? (
            <div className="p-8 text-center">
              <CheckCircle className="mx-auto h-14 w-14 text-green-600" />
              <h3 className="mt-3 text-xl font-extrabold text-green-950">Cadastro recebido!</h3>
              <p className="mx-auto mt-2 max-w-sm text-sm text-stone-600">
                Recebemos o cadastro da sua empresa! Ele está aguardando aprovação e, assim que for revisado, aparecerá no guia.
              </p>
              <button onClick={onClose} className="mt-6 rounded-full bg-amber-400 px-7 py-2.5 font-bold text-green-950 hover:bg-amber-300">
                Fechar
              </button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="space-y-4 p-5">
              <div>
                <label className={labelCls}>Nome fantasia *</label>
                <input className={inputCls} value={form.nome_fantasia} onChange={set("nome_fantasia")} maxLength={120} placeholder="Ex.: Padaria Pão Quente" required />
              </div>

              <div className="grid gap-4 sm:grid-cols-2">
                <div>
                  <label className={labelCls}>Categoria *</label>
                  <select className={inputCls} value={form.categoria} onChange={set("categoria")} required>
                    <option value="">Selecione...</option>
                    {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
                  </select>
                </div>
                <div>
                  <label className={labelCls}>Cidade *</label>
                  <select className={inputCls} value={form.cidade} onChange={set("cidade")} required>
                    <option value="">Selecione...</option>
                    {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
                    <option value={OTHER_CITY}>Outra cidade da região</option>
                  </select>
                </div>
              </div>

              {form.cidade === OTHER_CITY && (
                <div>
                  <label className={labelCls}>Qual cidade? *</label>
                  <input className={inputCls} value={form.outraCidade} onChange={set("outraCidade")} maxLength={80} placeholder="Nome da cidade" />
                </div>
              )}

              <div>
                <label className={labelCls}>Endereço</label>
                <input className={inputCls} value={form.endereco} onChange={set("endereco")} maxLength={200} placeholder="Rua, número, bairro" />
              </div>

              <div className="grid gap-4 sm:grid-cols-2">
                <div>
                  <label className={labelCls}>WhatsApp *</label>
                  <input className={inputCls} value={form.whatsapp} onChange={set("whatsapp")} inputMode="tel" placeholder="(77) 99999-0000" required />
                </div>
                <div>
                  <label className={labelCls}>Instagram</label>
                  <input className={inputCls} value={form.instagram} onChange={set("instagram")} placeholder="@seunegocio" />
                </div>
              </div>

              <div>
                <label className={labelCls}>Descrição</label>
                <textarea className={inputCls} rows={3} value={form.descricao} onChange={set("descricao")} maxLength={500} placeholder="Conte em poucas palavras o que você oferece" />
                <p className="mt-1 text-right text-xs text-stone-400">{form.descricao.length}/500</p>
              </div>

              <div>
                <label className={labelCls}>URL da foto / logo</label>
                <input className={inputCls} value={form.imagem_url} onChange={set("imagem_url")} inputMode="url" placeholder="https://..." />
                <p className="mt-1 text-xs text-stone-500">Cole o link de uma imagem já hospedada (opcional).</p>
              </div>

              <div>
                <label className={labelCls}>Link da localização no Google Maps</label>
                <div className="relative">
                  <MapPin className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" />
                  <input className={`${inputCls} pl-9`} value={form.mapa_url} onChange={set("mapa_url")} inputMode="url" placeholder="https://maps.app.goo.gl/..." />
                </div>
                <p className="mt-1 text-xs text-stone-500">Como pegar o link: Abra o Google Maps ➔ Pesquise seu negócio ➔ Clique em Compartilhar ➔ Copie o link e cole aqui.</p>
              </div>

              {/* Campo-isca: invisível para pessoas, preenchido por robôs */}
              <div className="absolute -left-[9999px] h-0 w-0 overflow-hidden" aria-hidden="true">
                <label>Não preencha<input tabIndex={-1} autoComplete="off" value={form.website} onChange={set("website")} /></label>
              </div>

              {error && <Notice type="err">{error}</Notice>}

              <div className="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
                <button type="button" onClick={onClose} className="rounded-full border border-stone-300 px-6 py-2.5 text-sm font-semibold text-stone-700 hover:bg-stone-50">
                  Cancelar
                </button>
                <button
                  type="submit" disabled={sending}
                  className="inline-flex items-center justify-center gap-2 rounded-full bg-amber-400 px-7 py-2.5 text-sm font-bold text-green-950 transition hover:bg-amber-300 disabled:opacity-60"
                >
                  {sending ? <><Loader className="h-4 w-4 animate-spin" /> Enviando...</> : "Enviar cadastro"}
                </button>
              </div>
              <p className="text-center text-xs text-stone-500">
                Seu cadastro passa por aprovação antes de aparecer no site.
              </p>
            </form>
          )}
        </Modal>
      );
    }

    /* ----------------------------------- PÁGINA ----------------------------------- */
    function GuiaRegionalPage() {
      const [query, setQuery] = useState("");
      const [category, setCategory] = useState("");
      const [city, setCity] = useState("");
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");

      const [user, setUser] = useState(null);
      const [authOpen, setAuthOpen] = useState(false);
      const [authReason, setAuthReason] = useState("");
      const [showForm, setShowForm] = useState(false);
      const [recovery, setRecovery] = useState(false);
      const wantsRegister = React.useRef(false);

      // Sessão do usuário (inclui o retorno do Google e dos links de e-mail)
      useEffect(() => {
        if (!sb) return;
        sb.auth.getSession().then(({ data }) => setUser((data.session && data.session.user) || null));
        const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
          setUser((session && session.user) || null);
          if (event === "PASSWORD_RECOVERY") setRecovery(true);
          if (event === "SIGNED_IN") {
            setAuthOpen(false);
            let pending = wantsRegister.current;
            try {
              if (sessionStorage.getItem(PENDING_KEY)) { pending = true; sessionStorage.removeItem(PENDING_KEY); }
            } catch {}
            if (pending) { wantsRegister.current = false; setShowForm(true); }
          }
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      // Lista somente os estabelecimentos aprovados
      useEffect(() => {
        let cancelled = false;
        async function load() {
          if (!sb) {
            setError("Conecte o Supabase: preencha SUPABASE_URL e SUPABASE_ANON_KEY no início do código.");
            setLoading(false);
            return;
          }
          const { data, error: dbError } = await sb
            .from("estabelecimentos")
            .select("id, nome_fantasia, categoria, cidade, endereco, whatsapp, instagram, descricao, imagem_url, mapa_url")
            .eq("aprovado", true)
            .order("nome_fantasia", { ascending: true });
          if (cancelled) return;
          if (dbError) {
            console.error(dbError);
            setError("Não foi possível carregar os estabelecimentos agora. Tente novamente mais tarde.");
          } else {
            setItems(data || []);
          }
          setLoading(false);
        }
        load();
        return () => { cancelled = true; };
      }, []);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return items.filter(
          (b) =>
            (!city || b.cidade === city) &&
            (!category || (b.categoria || "").toLowerCase() === category.toLowerCase()) &&
            (!q || (b.nome_fantasia || "").toLowerCase().includes(q) || (b.descricao || "").toLowerCase().includes(q))
        );
      }, [items, query, category, city]);

      const openLogin = () => { wantsRegister.current = false; setAuthReason(""); setAuthOpen(true); };
      const openRegister = () => {
        if (user) { setShowForm(true); return; }
        wantsRegister.current = true;
        setAuthReason("register");
        setAuthOpen(true);
      };
      const closeAuth = () => { wantsRegister.current = false; setAuthOpen(false); };
      const logout = async () => { if (sb) await sb.auth.signOut(); setUser(null); setShowForm(false); };

      const scrollToResults = () =>
        document.getElementById("destaques")?.scrollIntoView({ behavior: "smooth" });
      const clearFilters = () => { setQuery(""); setCategory(""); setCity(""); };

      return (
        <div className="min-h-screen bg-white font-sans text-stone-800 antialiased">
          <Header city={city} setCity={setCity} user={user} onRegister={openRegister} onLogin={openLogin} onLogout={logout} />
          <main>
            <Hero
              query={query} setQuery={setQuery} category={category} setCategory={setCategory}
              city={city} setCity={setCity} onSearch={scrollToResults}
            />
            <Categories active={category} setActive={setCategory} />
            <div id="destaques">
              <Featured items={filtered} loading={loading} error={error} onClear={clearFilters} onRegister={openRegister} />
            </div>
            <Agenda />
            <CtaBusiness onRegister={openRegister} />
          </main>
          <Footer />
          {authOpen && !user && <AuthModal onClose={closeAuth} reason={authReason} />}
          {showForm && user && <RegisterModal user={user} onClose={() => setShowForm(false)} />}
          {recovery && <NewPasswordModal onClose={() => setRecovery(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<GuiaRegionalPage />);
  </script>
</body>
</html>
